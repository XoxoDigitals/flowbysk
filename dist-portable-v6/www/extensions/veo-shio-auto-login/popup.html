<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Browser Auto Login</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand">
      <div class="brand-left">
        <div class="logo-circle"><img class="logo" src="icons/logo.png" alt="Flow Browser"></div>
        <div class="brand-copy">
          <div class="brand-title"><h1>Flow Browser</h1></div>
        </div>
      </div>
      <span class="version-badge" id="version-badge">v2.1.0</span>
    </header>

    <div id="account-dashboard">
      <section class="card user-card">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-details">
          <div class="user-username" id="customer-name">Not connected</div>
          <div class="user-plan" id="customer-plan">Plan unavailable</div>
          <div class="user-days">
            <span id="subscription-days">Plan details unavailable</span>
          </div>
          <div class="user-credits" style="margin-top:4px;font-size:11px;color:#38bdf8;">
            <span id="user-credits-display"></span>
          </div>
        </div>
      </section>
    </div>

    <div id="status" role="status" aria-live="polite">Checking connection…</div>

    <div id="not-connected-info" hidden>
      <p style="font-size:12px;color:#b9aec5;padding:8px 12px;margin:0;">
        Log in to Flow Browser to auto-connect. Google email, password, and TOTP come from Admin.
      </p>
    </div>

    <section id="connected-actions" hidden>
      <button id="start" class="main-action-btn">Start / Resume Flow Login</button>
      <button id="refresh" class="secondary" style="margin-top:8px;width:100%;">Refresh status</button>
    </section>

    <section id="flow-progress" class="progress-panel" hidden aria-labelledby="progress-heading">
      <div class="progress-heading">
        <h2 id="progress-heading">Login progress</h2>
        <div class="progress-status"><span id="progress-state" class="progress-state">Waiting</span><span id="progress-percent" class="progress-percent">0%</span></div>
      </div>
      <div id="progressbar" class="progress-track" role="progressbar" aria-label="Flow login progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="progress-fill" class="progress-fill"></span>
      </div>
      <p id="progress-label" class="progress-label">Waiting to start.</p>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
